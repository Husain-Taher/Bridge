<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bridge - Transfer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo">B</div>
        <div>
          <span class="title">Bridge</span>
          <span class="badge">Companion</span>
        </div>
      </div>
      <div class="status-indicator" id="status-indicator">
        <span class="dot"></span>
        <span id="status-text">Connected</span>
      </div>
    </header>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- Active Tab Info -->
    <div class="tab-card">
      <div class="tab-label">Current Page</div>
      <div class="tab-title" id="tab-title">Loading active tab...</div>
      <div class="tab-url" id="tab-url">...</div>
    </div>

    <!-- Primary Actions -->
    <div class="action-buttons">
      <button id="btn-send-tab" class="btn btn-primary">
        <span class="icon">↗</span> Send Page to Phone
      </button>

      <button id="btn-send-selection" class="btn btn-secondary">
        <span class="icon">❝</span> Send Selected Text
      </button>
    </div>

    <!-- Quick Text Snippet -->
    <div class="snippet-section">
      <textarea id="snippet-input" placeholder="Quick snippet, note, or prompt..."></textarea>
      <button id="btn-send-snippet" class="btn btn-small">Send Snippet</button>
    </div>

    <!-- Footer Settings & Pairing Link -->
    <footer class="footer" style="flex-direction: column; align-items: stretch; gap: 6px;">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <span class="shortcut-tip">Shortcut: Alt+Shift+B</span>
        <button id="btn-toggle-config" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px;">⚙ Settings</button>
      </div>
      <div id="config-section" class="hidden" style="margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--surface-border);">
        <input type="text" id="bridge-url-input" placeholder="https://your-bridge.vercel.app" style="width: 100%; padding: 6px; font-size: 11px; background: #18181b; border: 1px solid #27272a; color: #fff; border-radius: 6px; margin-bottom: 6px;" />
        <button id="btn-save-config" class="btn btn-small" style="width: 100%;">Save Server URL</button>
      </div>
      <div style="display: flex; justify-content: flex-end; width: 100%; margin-top: 2px;">
        <a href="#" id="link-open-bridge" class="footer-link">Open Inbox ↗</a>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
